<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>WhatsLNX License</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 24px;
      overflow-y: auto;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffffff;
    }
    .section {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 16px;
    }
    pre {
      font-family: 'Ubuntu Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
      font-size: 11.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: #ccc;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h2>GNU General Public License v3.0</h2>
  <div class="section">
    <pre id="license-text">Loading…</pre>
  </div>

  <script>
    'use strict';
    (async () => {
      try {
        const text = await window.whatslnxAbout.getLicenseText();
        document.getElementById('license-text').textContent = text || 'License file not found.';
      } catch {
        document.getElementById('license-text').textContent = 'Could not load the license text.';
      }
    })();
  </script>
</body>
</html>
