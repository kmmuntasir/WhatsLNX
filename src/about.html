<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
  <title>About WhatsLNX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 24px;
      overflow-y: auto;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }
    .header .tagline {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .version-chip {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 14px;
      background: #25d366;
      color: #00301a;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .section {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .notes h3 {
      font-size: 13px;
      font-weight: 600;
      color: #25d366;
      margin: 10px 0 6px;
    }
    .notes h3:first-child { margin-top: 0; }
    .notes ul { margin-left: 18px; }
    .notes li {
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 5px;
      color: #ccc;
    }
    .notes p {
      font-size: 12.5px;
      line-height: 1.5;
      color: #ccc;
    }
    .notes .muted { color: #888; }
    .footer {
      text-align: center;
      font-size: 11.5px;
      color: #888;
      line-height: 1.7;
    }
    .footer a { color: #6ab8f5; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    button {
      appearance: none;
      border: 1px solid #444;
      border-radius: 6px;
      background: #333;
      color: #e0e0e0;
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #3a3a3a; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../assets/icons/512x512.png" alt="WhatsLNX logo">
    <h1>WhatsLNX</h1>
    <div class="tagline">Unofficial WhatsApp client for Linux</div>
    <div class="version-chip" id="version">…</div>
  </div>

  <div class="section">
    <div class="section-title">Release Notes</div>
    <div class="notes" id="notes"><p class="muted">Loading…</p></div>
  </div>

  <div class="footer">
    Copyright © 2026 Muntasir Billah Munna<br>
    Licensed under <a href="#" id="license-link">GPL-3.0</a> ·
    <a href="https://github.com/kmmuntasir/WhatsLNX">GitHub</a> ·
    <a href="https://kmmuntasir.github.io/WhatsLNX/">Website</a><br>
    WhatsApp is a trademark of Meta Platforms, Inc. WhatsLNX is not affiliated with Meta.
    <br>
    <button id="license-button" type="button">View License</button>
  </div>

  <script>
    'use strict';
    (async () => {
      try {
        const info = await window.whatslnxAbout.getAboutInfo();
        document.getElementById('version').textContent = `v${info.version}`;
        document.getElementById('notes').innerHTML = info.notesHtml;
      } catch {
        document.getElementById('notes').innerHTML = '<p class="muted">Could not load release notes.</p>';
      }
    })();

    const openLicense = (e) => {
      e.preventDefault();
      window.whatslnxAbout.openLicenseWindow();
    };
    document.getElementById('license-button').addEventListener('click', openLicense);
    document.getElementById('license-link').addEventListener('click', openLicense);
  </script>
</body>
</html>
